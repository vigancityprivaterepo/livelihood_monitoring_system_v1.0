<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Livelihood Assistance Monitoring System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<script src="/icons.js"></script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="auth">
    <div class="auth-brand">
      <img src="/logo.png" alt="City of Vigan seal">
      <h1>Livelihood Assistance Monitoring System</h1>
      <p>CSWDO &middot; City of Vigan</p>
      <p class="auth-offline">Staff sign-in. Contact your administrator if you don't have an account.</p>
    </div>
    <div class="auth-panel">
      <form class="auth-form" id="loginForm">
        <h2>Staff Login</h2>
        <p class="sub">Sign in to continue to the monitoring form.</p>
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" autofocus required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <p class="error" id="err">Incorrect username or password.</p>
        <button type="submit" data-icon="lock">Login</button>
      </form>
    </div>
  </div>

<script>
document.querySelectorAll('[data-icon]').forEach(el=>{
  el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, {size:15}));
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  try{
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if(!res.ok){ err.style.display = 'block'; return; }
    window.location.href = '/';
  }catch(ex){
    err.textContent = 'Could not reach server: ' + ex.message;
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
