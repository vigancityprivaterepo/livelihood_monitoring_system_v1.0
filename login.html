<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Livelihood Assistance Monitoring System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<script src="/icons.js"></script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="auth">
    <div class="auth-brand">
      <img src="/logo.png" alt="City of Vigan seal">
      <h1>Livelihood Assistance Monitoring</h1>
      <p>City Social Welfare and Development Office &middot; City of Vigan, Ilocos Sur</p>
      <p class="auth-offline">Works offline on the office network.</p>
    </div>
    <div class="auth-panel">
      <form class="auth-form" id="loginForm">
        <h2>Sign in</h2>
        <p class="sub">Use the account Admin issued you.</p>
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" placeholder="cswdo.staff" autofocus required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <p class="error" id="err">Incorrect username or password.</p>
        <button type="submit" data-icon="lock">Log in</button>
        <a class="auth-alt" href="/admin/login">Admin sign-in</a>
      </form>
    </div>
  </div>

<script>
document.querySelectorAll('[data-icon]').forEach(el=>{
  el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, {size:15}));
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  try{
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if(!res.ok){ err.style.display = 'block'; return; }
    window.location.href = '/';
  }catch(ex){
    err.textContent = 'Could not reach server: ' + ex.message;
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
