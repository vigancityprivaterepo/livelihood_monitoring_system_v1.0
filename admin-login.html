<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Livelihood Assistance Monitoring System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<script src="/icons.js"></script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body class="admin-auth">
  <form class="auth-card" id="loginForm">
    <div class="auth-seal" data-icon="shield-check"></div>
    <h1>Admin sign-in</h1>
    <p class="sub">Restricted to CSWDO system administrators.</p>
    <div class="field">
      <label>Admin username</label>
      <input type="text" id="username" autofocus required autocomplete="username">
    </div>
    <div class="field">
      <label>Admin password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <p class="error" id="err">Incorrect username or password.</p>
    <button type="submit" data-icon="shield-check">Continue</button>
    <a class="auth-alt" href="/login">Back to staff login</a>
  </form>

<script>
document.querySelectorAll('[data-icon]').forEach(el=>{
  el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, {size:15}));
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  try{
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if(!res.ok){ err.style.display = 'block'; return; }
    window.location.href = '/admin';
  }catch(ex){
    err.textContent = 'Could not reach server: ' + ex.message;
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
