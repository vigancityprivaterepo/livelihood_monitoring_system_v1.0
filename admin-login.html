<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Livelihood Assistance Monitoring System</title>
<link rel="icon" type="image/png" href="/logo.png">
<script src="/icons.js"></script>
<style>
  :root{ --navy:#047857; --navy-dark:#065f46; --accent:#c0392b; --bg:#e9edf0; --border:#b9c2c9; --muted:#48525c; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI',Arial,sans-serif; background:var(--bg);
  }
  .card{
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:32px 30px;
    width:100%; max-width:340px; box-shadow:0 4px 18px rgba(0,0,0,.08); text-align:center;
  }
  .card img{height:60px; width:60px; margin-bottom:10px;}
  .card h1{font-size:15px; color:var(--navy); margin:0 0 4px;}
  .card .sub{font-size:12px; color:var(--muted); margin:0 0 22px;}
  .field{text-align:left; margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px;}
  .field input{width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:6px; font-size:14px;}
  button{
    width:100%; background:var(--accent); color:#fff; border:none; padding:11px; border-radius:6px;
    font-size:14px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  button:hover{opacity:.92;}
  .error{color:var(--accent); font-size:12.5px; margin:-6px 0 14px; display:none;}
  .back{display:inline-flex; align-items:center; gap:5px; margin-top:16px; font-size:12.5px; color:var(--navy); text-decoration:none;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <img src="/logo.png" alt="City of Vigan seal">
    <h1>Admin Access</h1>
    <p class="sub">Manage staff accounts &amp; dropdown values</p>
    <div class="field">
      <label>Admin Username</label>
      <input type="text" id="username" autofocus required autocomplete="username">
    </div>
    <div class="field">
      <label>Admin Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <p class="error" id="err">Incorrect username or password.</p>
    <button type="submit" data-icon="shield-check">Login</button>
    <a class="back" href="/" data-icon="chevron-left">Back to app</a>
  </form>

<script>
document.querySelectorAll('[data-icon]').forEach(el=>{
  el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, {size:15}));
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  try{
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if(!res.ok){ err.style.display = 'block'; return; }
    window.location.href = '/admin';
  }catch(ex){
    err.textContent = 'Could not reach server: ' + ex.message;
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
